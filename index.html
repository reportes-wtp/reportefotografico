<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reporte Fotográfico</title>
<meta name="theme-color" content="#4b6f7f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* VOICE: herramienta de campo, directa, de obra
   IDEA: la hoja A4 del reporte fotográfico armándose en vivo
   PICTURE: la grilla de fotos agrupada por hojas de 6, como el PDF final
   COLOUR and TYPE: gris petróleo y rojo Bechtel; Barlow Condensed + Inter
   LAYOUT: datos arriba, fotos al medio, botón grande para generar */
:root{color-scheme:light dark;--bg:light-dark(#f3f5f6,#0f1518);--card:light-dark(#fff,#182126);--ink:light-dark(#18242a,#e8eef0);--mut:light-dark(#5b6b72,#93a4ab);--line:light-dark(#d7dfe2,#2a363c);--teal:#4b6f7f;--red:#e8412b}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
.top{background:var(--teal);color:#fff;padding:18px max(5vw,16px) 22px;border-bottom:5px solid var(--red)}
.top h1{font:700 clamp(30px,6vw,44px)/1.05 "Barlow Condensed",sans-serif;margin:0;letter-spacing:.01em}
.top p{margin:4px 0 0;opacity:.85;font-size:15px}
.brand{display:flex;gap:10px;margin-bottom:12px}
.brand img{height:34px;background:#fff;border-radius:6px;padding:3px 6px}
main{max-width:1100px;margin:0 auto;padding:18px max(4vw,14px) 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{font:600 20px/1.2 "Barlow Condensed",sans-serif;margin:0 0 12px;color:var(--teal)}
:root[data-theme=dark] .card h2{color:#8fb3c3}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .card h2{color:#8fb3c3}}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
input[type=text],select{width:100%;font:16px Inter,sans-serif;padding:10px 12px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.fname{margin-top:12px;font-size:14px;color:var(--mut)}.fname b{color:var(--ink);overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font:600 16px Inter,sans-serif;min-height:44px;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.count{margin-left:auto;font:700 22px "Barlow Condensed",sans-serif}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent}
.seg button[aria-pressed=true]{background:var(--teal);color:#fff}
.page{margin-top:16px}
.page h3{font:600 15px Inter,sans-serif;color:var(--mut);margin:0 0 8px}
.sheet{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;background:light-dark(#fff,#0b1013);border:1px solid var(--line);border-radius:8px;padding:10px;max-width:520px}
@media(min-width:760px){.pages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}}
.ph{position:relative;aspect-ratio:235/228;border-radius:4px;overflow:hidden;background:var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.fit .ph img{object-fit:contain;background:#fff}
.ph .n{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.65);color:#fff;font-size:13px;font-weight:600;padding:1px 7px;border-radius:10px}
.ph .tools{position:absolute;bottom:4px;right:4px;display:flex;gap:4px}
.ph .tools button{width:36px;height:36px;border:0;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:16px;cursor:pointer}
.pick{position:relative;overflow:hidden;display:inline-flex;align-items:center;margin:0;color:var(--ink);font-size:16px}
.fi{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.empty{position:relative;user-select:none;-webkit-user-select:none;border:2px dashed var(--line);border-radius:12px;padding:36px 16px;text-align:center;color:var(--mut);cursor:pointer}
.empty b{display:block;font:700 22px "Barlow Condensed",sans-serif;color:var(--ink)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px max(4vw,14px) calc(12px + env(safe-area-inset-bottom))}
.bar .in{max-width:1100px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar .btn.pri{flex:1 1 220px;font-size:18px;min-height:52px}
.prog{flex:1 1 100%;height:6px;background:var(--line);border-radius:3px;overflow:hidden;display:none}
.prog i{display:block;height:100%;width:0;background:var(--red);transition:width .2s}
.msg{font-size:14px;color:var(--mut);flex:1 1 200px}
.msg.err{color:var(--red)}
@media(prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><img id="lb" alt="Bechtel"><img id="lp" alt="PEMS"></div>
  <h1>Reporte fotográfico</h1>
  <p>Sube hasta 200 fotos y genera el PDF A4 con logos, 6 fotos por hoja.</p>
</header>
<main>
  <section class="card">
    <h2>Nombre del PDF</h2>
    <div><label for="nm">Nombre del archivo</label><input type="text" id="nm" placeholder="Ej. 00226092-B55457_MANTENIMIENTO" autocomplete="off" autocapitalize="characters"></div>
    <div class="fname">Archivo: <b id="fn">—</b></div>
  </section>

  <section class="card">
    <div class="row">
      <h2 style="margin:0">Fotos</h2>
      <span class="count" id="cnt">0 / 200</span>
    </div>
    <div class="row" style="margin-top:12px">
      <label class="btn pick" id="add">+ Agregar fotos<input type="file" class="fi" accept="image/*" multiple></label>
      <div class="seg" role="group" aria-label="Ajuste de foto">
        <button class="btn" type="button" id="mCover" aria-pressed="true">Llenar marco</button>
        <button class="btn" type="button" id="mFit" aria-pressed="false">Foto completa</button>
      </div>
      <button class="btn" id="clr" type="button">Borrar todas</button>
    </div>
        <div id="grid"></div>
  </section>
</main>
<div class="bar"><div class="in">
  <div class="prog" id="prog"><i></i></div>
  <span class="msg" id="msg">Escribe el nombre y agrega las fotos.</span>
  <button class="btn" id="share" type="button" hidden>Compartir</button><button class="btn" id="again" type="button" hidden>Descargar otra vez</button>
  <button class="btn pri" id="gen" type="button" disabled>Generar PDF</button>
</div></div>

{
const MAX=200,PER=6;
const $=id=>document.getElementById(id);
let photos=[],uid=0,mode='cover',busy=false,lastPdf=null;
$('lb').src=LOGO_B;$('lp').src=LOGO_P;

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
{const v=store.get('rf_nm');if(v)$('nm').value=v}
const clean=s=>s.replace(/[\\/:*?"<>|]+/g,'-').replace(/\.pdf$/i,'').trim();
function fname(){const n=clean($('nm').value);return (n||'REPORTE_FOTOGRAFICO')+'.pdf'}
function upd(){
  $('fn').textContent=fname();
  store.set('rf_nm',$('nm').value);
  $('cnt').textContent=photos.length+' / '+MAX;
  $('gen').disabled=busy||!photos.length;
  $('clr').disabled=busy||!photos.length;
  for(const f of document.querySelectorAll('.fi'))f.disabled=busy||photos.length>=MAX;
}
$('nm').addEventListener('input',upd);

function msg(t,err){$('msg').textContent=t;$('msg').className='msg'+(err?' err':'')}
function render(){
  const g=$('grid');g.className=mode==='fit'?'fit':'';
  if(!photos.length){g.innerHTML='<label class="empty" style="display:block;margin-top:14px"><b>Toca para elegir fotos</b>Desde la galería, hasta '+MAX+'.<input type="file" class="fi" accept="image/*" multiple></label>';upd();return}
  let h='<div class="pages">';
  for(let p=0;p<photos.length;p+=PER){
    h+='<div class="page"><h3>Hoja '+(p/PER+1)+'</h3><div class="sheet">';
    photos.slice(p,p+PER).forEach((f,j)=>{const i=p+j;
      h+='<div class="ph"><img src="'+f.url+'" alt="Foto '+(i+1)+'" loading="lazy"><span class="n">'+(i+1)+'</span><div class="tools">'+
      (i>0?'<button type="button" data-a="l" data-i="'+i+'" aria-label="Mover antes">◀</button>':'')+
      (i<photos.length-1?'<button type="button" data-a="r" data-i="'+i+'" aria-label="Mover después">▶</button>':'')+
      '<button type="button" data-a="x" data-i="'+i+'" aria-label="Quitar foto">✕</button></div></div>'});
    h+='</div></div>';
  }
  g.innerHTML=h+'</div>';upd();
}
$('grid').addEventListener('click',e=>{
  const b=e.target.closest('button[data-a]');if(!b||busy)return;
  const i=+b.dataset.i,a=b.dataset.a;
  if(a==='x'){URL.revokeObjectURL(photos[i].url);photos.splice(i,1)}
  else{const j=a==='l'?i-1:i+1;[photos[i],photos[j]]=[photos[j],photos[i]]}
  render();
});
function addFiles(list){
  const imgs=[...list].filter(f=>f.type.startsWith('image/')||/\.(jpe?g|png|heic|webp)$/i.test(f.name));
  const room=MAX-photos.length;
  imgs.slice(0,room).forEach(f=>photos.push({id:++uid,file:f,url:URL.createObjectURL(f)}));
  if(imgs.length>room)msg('Solo se agregaron '+room+'. El máximo es '+MAX+' fotos.',true);
  else msg(photos.length+' foto(s) listas.');
  render();
}
document.addEventListener('change',e=>{if(e.target.classList&&e.target.classList.contains('fi')){addFiles(e.target.files);e.target.value=''}});
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{e.preventDefault();if(!busy&&e.dataTransfer.files.length)addFiles(e.dataTransfer.files)});

function setMode(m){mode=m;$('mCover').setAttribute('aria-pressed',m==='cover');$('mFit').setAttribute('aria-pressed',m==='fit');render()}
$('mCover').onclick=()=>setMode('cover');$('mFit').onclick=()=>setMode('fit');

function loadImg(url){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('img'));im.src=url})}
// Hoja A4 en puntos: 595.28 x 841.89
const PW=595.28,PH=841.89,MX=48,TOP=74,BOT=800,GX=22,GY=16;
const CW=(PW-2*MX-GX)/2,CH=(BOT-TOP-2*GY)/3,SC=3;
async function cellJpg(url){
  const im=await loadImg(url);
  const sc=photos.length>100?2.4:SC,w=Math.round(CW*sc),h=Math.round(CH*sc),c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);
  const iw=im.naturalWidth,ih=im.naturalHeight;
  const s=mode==='cover'?Math.max(w/iw,h/ih):Math.min(w/iw,h/ih);
  const dw=iw*s,dh=ih*s;x.imageSmoothingQuality='high';
  x.drawImage(im,(w-dw)/2,(h-dh)/2,dw,dh);
  const d=c.toDataURL('image/jpeg',photos.length>100?0.76:0.82);c.width=c.height=0;return d;
}
function header(doc,p,n){
  const lh=30;
  doc.addImage(LOGO_B,'JPEG',MX,20,lh*LOGO_B_R,lh);
  const pw=lh*LOGO_P_R*0.9;doc.addImage(LOGO_P,'JPEG',PW-MX-pw,22,pw,lh*0.9);
  doc.setFont('helvetica','normal');doc.setFontSize(15);doc.setTextColor(0);
  doc.text('REPORTE FOTOGRÁFICO',PW/2,42,{align:'center'});
  doc.setDrawColor(0);doc.setLineWidth(0.8);doc.line(MX,58,PW-MX,58);
  doc.setFontSize(8);doc.text('Página '+p+' de '+n,PW/2,PH-22,{align:'center'});
}

      try{const d=await cellJpg(photos[i].url);
        const col=k%2,row=Math.floor(k/2);
        doc.addImage(d,'JPEG',MX+col*(CW+GX),TOP+row*(CH+GY),CW,CH,undefined,'FAST');
      }catch(e){bad++}
      bar.style.width=((i+1)/photos.length*100)+'%';
      if(i%4===3)await new Promise(r=>setTimeout(r,0));
    }
    const blob=doc.output('blob');
    const mb=(blob.size/1048576).toFixed(1);
    lastPdf={blob,name};bajar();$('share').hidden=!canShare(blob,name);$('again').hidden=false;
    photos.forEach(p=>URL.revokeObjectURL(p.url));photos=[];$('nm').value='';store.set('rf_nm','');
    msg('Listo: '+name+' ('+mb+' MB) · Formulario limpio para el siguiente'+(bad?' · '+bad+' foto(s) no se pudieron leer':''),!!bad);
  }catch(e){
    const c=e&&e.code;
    msg('No se pudo generar el PDF: '+(e&&e.message||e),true);
  }finally{busy=false;$('prog').style.display='none';bar.style.width='0';render()}
};
function bajar(){if(!lastPdf)return;const u=URL.createObjectURL(lastPdf.blob),a=document.createElement('a');a.href=u;a.download=lastPdf.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
function canShare(b,n){try{return !!(navigator.canShare&&navigator.canShare({files:[new File([b],n,{type:'application/pdf'})]}))}catch(e){return false}}
$('again').onclick=bajar;
$('share').onclick=async()=>{if(!lastPdf)return;try{await navigator.share({files:[new File([lastPdf.blob],lastPdf.name,{type:'application/pdf'})],title:lastPdf.name})}catch(e){}};
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
}
</script>
</body>
